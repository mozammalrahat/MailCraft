services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailcraft
      POSTGRES_PASSWORD: mailcraft
      POSTGRES_DB: mailcraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailcraft -d mailcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://mailcraft:mailcraft@db:5432/mailcraft
      RUN_MIGRATIONS_ON_STARTUP: "false"
      HOST: 0.0.0.0
      PORT: 8081
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - upload_data:/app/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health/ready')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    profiles: ["scale"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    profiles: ["scale"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  worker:
    profiles: ["scale"]
    build: .
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+psycopg://mailcraft:mailcraft@db:5432/mailcraft
      RUN_MIGRATIONS_ON_STARTUP: "false"
      GENERATION_ASYNC_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: [".venv/bin/mailcraft-worker"]
    volumes:
      - upload_data:/app/data/uploads

volumes:
  postgres_data:
  upload_data:
  minio_data:

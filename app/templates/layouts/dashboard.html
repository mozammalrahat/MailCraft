{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto w-full">
  <div class="flex flex-col lg:flex-row gap-6">
    <aside class="lg:w-56 flex-shrink-0">
      <nav class="bg-white rounded-2xl border border-stone-200/80 p-3 space-y-0.5 sticky lg:top-20 shadow-sm">
        <p class="text-[11px] font-semibold text-stone-400 uppercase tracking-widest px-3 pt-1 pb-2">Navigation</p>
        <a href="/dashboard" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-stone-600 hover:bg-brand-50 hover:text-brand-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          History
        </a>
        <a href="/dashboard/generate" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-stone-600 hover:bg-brand-50 hover:text-brand-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          Generate
        </a>
        <a href="/dashboard/scenarios" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-stone-600 hover:bg-brand-50 hover:text-brand-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          Scenarios
        </a>
        <div class="pt-2 mt-2 border-t border-stone-100">
          <form method="post" action="/auth/logout">
            <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
            <button type="submit" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium text-stone-400 hover:bg-red-50 hover:text-red-600 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
              Sign out
            </button>
          </form>
        </div>
      </nav>
    </aside>
    <div class="flex-grow min-w-0">
      {% block dashboard_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}

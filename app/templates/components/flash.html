{% if messages %}
  <div class="space-y-3 mb-6">
    {% for message in messages %}
      {% set alert_class = 'bg-red-50 text-red-700 border-red-100' if message.type == 'error' else 'bg-emerald-50 text-emerald-700 border-emerald-100' %}
      <div class="p-4 rounded-xl border text-sm font-medium flex items-start gap-3 shadow-sm {{ alert_class }}" role="alert">
        {% if message.type == 'error' %}
          <svg class="w-5 h-5 flex-shrink-0 text-red-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% else %}
          <svg class="w-5 h-5 flex-shrink-0 text-emerald-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        {% endif %}
        <div>{{ message.text }}</div>
      </div>
    {% endfor %}
  </div>
{% endif %}

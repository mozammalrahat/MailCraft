{% if messages %}
  <div class="space-y-2">
    {% for message in messages %}
      {% set alert_class = 'bg-red-50 text-red-800 border-red-200' if message.type == 'error' else 'bg-green-50 text-green-800 border-green-200' %}
      <div class="p-4 rounded-md border text-sm {{ alert_class }}" role="alert">
        {{ message.text }}
      </div>
    {% endfor %}
  </div>
{% endif %}
